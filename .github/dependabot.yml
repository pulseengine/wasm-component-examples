version: 2
# All github-actions pins in / land as one PR (#14-#17 were four separate PRs
# for four independent pins).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - "^[^@]+/"
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    labels:
      - dependencies

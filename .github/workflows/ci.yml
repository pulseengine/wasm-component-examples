name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bazelisk
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            curl -LO https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
            chmod +x bazelisk-linux-amd64
            sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel
          else
            brew install bazelisk
          fi

      - name: Build all components
        # The rust_p3 *_bindings_host targets (and the *_wasm_lib_release_host
        # libraries built on them) cannot compile async-typed WIT
        # (pulseengine/rules_wasm_component#720); nothing here consumes them.
        run: >-
          bazel build -- //...
          -//rust_p3:concurrent_tasks_bindings_host
          -//rust_p3:text_processor_bindings_host
          -//rust_p3:p3_runner_bindings_host
          -//rust_p3:concurrent_tasks_wasm_lib_release_host
          -//rust_p3:text_processor_wasm_lib_release_host
          -//rust_p3:p3_runner_wasm_lib_release_host

      - name: List built artifacts
        run: |
          echo "=== C Components ==="
          bazel cquery --output=files '//c:all' 2>/dev/null || true
          echo ""
          echo "=== C++ Components ==="
          bazel cquery --output=files '//cpp:all' 2>/dev/null || true
          echo ""
          echo "=== Rust Components ==="
          bazel cquery --output=files '//rust:all' 2>/dev/null || true
          echo ""
          echo "=== Rust P3 Components ==="
          bazel cquery --output=files '//rust_p3:all' 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-components-${{ matrix.os }}
          path: |
            bazel-out/**/bin/**/*.wasm
          retention-days: 7

  test-rust-cli:
    name: Test Rust CLI Components
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bazelisk
        run: |
          curl -LO https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel

      - name: Install Wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Build Rust CLI components
        run: bazel build //rust:cli_components

      - name: Test hello_rust
        run: |
          WASM_FILE=$(bazel cquery --output=files //rust:hello_rust 2>/dev/null | head -1)
          wasmtime run "$WASM_FILE"

      - name: Test calculator
        run: |
          WASM_FILE=$(bazel cquery --output=files //rust:calculator 2>/dev/null | head -1)
          OUTPUT=$(wasmtime run "$WASM_FILE" 8 + 8)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "8 + 8 = 16"

      - name: Test datetime
        run: |
          WASM_FILE=$(bazel cquery --output=files //rust:datetime 2>/dev/null | head -1)
          wasmtime run "$WASM_FILE"

  test-p3-cli:
    name: Test P3 Composed CLI
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bazelisk
        run: |
          curl -LO https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel

      - name: Install Wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Build P3 composed CLI
        run: bazel build //rust_p3:p3_cli

      - name: Test analyze
        run: |
          WASM_FILE=$(bazel cquery --output=files //rust_p3:p3_cli 2>/dev/null | head -1)
          OUTPUT=$(wasmtime run -W component-model-async=y "$WASM_FILE" analyze hello world)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "words=2"

      - name: Test fibonacci
        run: |
          WASM_FILE=$(bazel cquery --output=files //rust_p3:p3_cli 2>/dev/null | head -1)
          OUTPUT=$(wasmtime run -W component-model-async=y "$WASM_FILE" fibonacci 10)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "fibonacci(10) = 55"

      - name: Test transform
        run: |
          WASM_FILE=$(bazel cquery --output=files //rust_p3:p3_cli 2>/dev/null | head -1)
          OUTPUT=$(wasmtime run -W component-model-async=y "$WASM_FILE" transform uppercase hello)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "HELLO"

      - name: Test prime
        run: |
          WASM_FILE=$(bazel cquery --output=files //rust_p3:p3_cli 2>/dev/null | head -1)
          OUTPUT=$(wasmtime run -W component-model-async=y "$WASM_FILE" prime 17)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "17 is prime"

      - name: Test batch
        run: |
          WASM_FILE=$(bazel cquery --output=files //rust_p3:p3_cli 2>/dev/null | head -1)
          OUTPUT=$(wasmtime run -W component-model-async=y "$WASM_FILE" batch 5 10)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "fibonacci"
